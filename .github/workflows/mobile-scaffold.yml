# TEMPORARY (removed before merge): creates the native folders and commits them to this branch.
name: mobile scaffold (temporary)
on:
  push:
    branches: [step-2a/mobile-foundation]
    paths: [.github/workflows/mobile-scaffold.yml]
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.9 }
      - name: Create native folders
        run: |
          flutter create --org com.kaamnishaan --project-name kaamnishaan --platforms=android,ios,macos /tmp/kn
          cp -r /tmp/kn/android /tmp/kn/ios /tmp/kn/macos /tmp/kn/.metadata mobile/
          cp /tmp/kn/.gitignore mobile/.gitignore
          cd /tmp/kn && flutter pub add flutter_tts && grep "flutter_tts" pubspec.yaml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android mobile/ios mobile/macos mobile/.metadata mobile/.gitignore
          git commit -m "mobile: native folders from flutter create (Flutter 3.47.9)"
          git push
