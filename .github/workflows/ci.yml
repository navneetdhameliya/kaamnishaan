name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Tokens, translations, API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node shared/design-tokens/build.mjs --check
      - run: node shared/i18n/build.mjs --check
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml openapi-spec-validator && python shared/api/validate.py

  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  frontends:
    name: ${{ matrix.app }} (typecheck + build)
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [web, admin] }
    defaults: { run: { working-directory: "${{ matrix.app }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "${{ matrix.app }}/package-lock.json" }
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile (analyze + test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
