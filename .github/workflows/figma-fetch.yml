name: figma-fetch (temporary)
on:
  push:
    branches: [step-4a/admin-login]
    paths: ['.github/figma-fetch/manifest.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - name: Download and convert
        run: |
          mkdir -p admin/public/img
          while read -r name width url; do
            [ -z "$name" ] && continue
            curl -fsSL -o /tmp/src.png "$url"
            python3 - "$name" "$width" <<'PY'
          import sys
          from PIL import Image
          name, width = sys.argv[1], int(sys.argv[2])
          im = Image.open('/tmp/src.png')
          im = im.convert('RGBA') if im.mode in ('RGBA', 'LA', 'P') else im.convert('RGB')
          if width and im.width > width:
              im = im.resize((width, round(im.height * width / im.width)), Image.LANCZOS)
          im.save('admin/public/img/' + name, 'WEBP', quality=82, method=6)
          print(name, im.size)
          PY
          done < .github/figma-fetch/manifest.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add admin/public/img
          git commit -m "Admin images from Figma" || echo "nothing new"
          git push
