[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kaamnishaan-backend"
version = "0.1.0"
description = "KaamNishaan API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "phonenumbers>=8.13",
  "email-validator>=2.2",
  "pillow>=11.0",
  "boto3>=1.35",
  "arq>=0.26",
  "fpdf2>=2.8",
  "uharfbuzz>=0.40",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["S105", "S106", "S107", "S608", "E501", "F811"]  # F811: fixtures shared between test files
"app/services/report_labels.py" = ["E501"]  # translated sentences are kept whole

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "app.core.deps.requires"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
