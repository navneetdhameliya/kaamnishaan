# Local Postgres for development: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kaamnishaan
      POSTGRES_PASSWORD: kaamnishaan
      POSTGRES_DB: kaamnishaan
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
