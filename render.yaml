# Render Blueprint — India-first: everything in the Singapore region.
# Secrets (OpenAI, R2, MSG91) are added in the Render dashboard, never here.
databases:
  - name: kaamnishaan-db
    region: singapore
    databaseName: kaamnishaan
    user: kaamnishaan
    postgresMajorVersion: "16"

services:
  - type: web
    name: kaamnishaan-api
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: KN_ENV
        value: staging
      - key: KN_DATABASE_URL
        fromDatabase: { name: kaamnishaan-db, property: connectionString }
      - key: KN_SECRET_KEY
        generateValue: true
      - key: KN_CORS_ORIGINS
        value: '["https://kaamnishaan-web.vercel.app","https://kaamnishaan-admin.vercel.app"]'
      - key: KN_API_URL
        value: https://kaamnishaan-api.onrender.com
      - key: KN_REDIS_URL
        fromService: { type: keyvalue, name: kaamnishaan-redis, property: connectionString }
      - fromGroup: kaamnishaan-secrets

  # Background worker: thumbnails now; SMS, AI drafts and PDFs in later steps.
  - type: worker
    name: kaamnishaan-worker
    runtime: docker
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: arq app.worker.WorkerSettings
    autoDeploy: true
    envVars:
      - key: KN_ENV
        value: staging
      - key: KN_DATABASE_URL
        fromDatabase: { name: kaamnishaan-db, property: connectionString }
      - key: KN_SECRET_KEY
        fromService: { type: web, name: kaamnishaan-api, envVarKey: KN_SECRET_KEY }
      - key: KN_REDIS_URL
        fromService: { type: keyvalue, name: kaamnishaan-redis, property: connectionString }
      - fromGroup: kaamnishaan-secrets

  - type: keyvalue
    name: kaamnishaan-redis
    region: singapore
    plan: free
    ipAllowList: []  # only Render services can reach it

envVarGroups:
  # Values are typed into the Render dashboard, never committed.
  - name: kaamnishaan-secrets
    envVars:
      - key: KN_STORAGE_PROVIDER
        value: r2
      - key: KN_STORAGE_BUCKET
        value: kaamnishaan-staging
      - key: KN_STORAGE_ENDPOINT
        sync: false
      - key: KN_STORAGE_ACCESS_KEY
        sync: false
      - key: KN_STORAGE_SECRET_KEY
        sync: false
      - key: KN_OPENAI_API_KEY
        sync: false
